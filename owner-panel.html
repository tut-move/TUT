<div class="ownerKingBar">THE KING OF TUT</div>
      <div class="pageHead ownerHead"><div><h1>TUT Move Owner Dashboard</h1><p>Monitor the market; do not control its prices.</p></div><button class="outlineBtn" onclick="loadAdmin()">Refresh</button></div>
      <details class="panel ownerSection" open><summary>Site & ownership</summary><div class="ownerSectionBody"><div class="two"><div><label>Brand</label><input id="brandName" value="TUT Move"></div><div><label>Official domain</label><input id="siteUrl" value="https://tutmove.com"></div></div><div class="two"><div><label>Owner / founder name</label><input id="ownerName" placeholder="Your legal name"></div><div><label>Owner email</label><input id="ownerEmail" type="email" placeholder="Private owner email"></div></div><div class="two"><div><label>Legal entity (optional)</label><input id="legalEntity" placeholder="Company name when registered"></div><div><label>Public support email</label><input id="supportEmail" type="email" placeholder="support@tutmove.com"></div></div><button class="goldBtn" onclick="saveOwnership()">Save ownership settings</button></div></details>
      <div class="ownerSettingsGrid">
       <details class="panel ownerSection" open><summary>Commission & reporting currency</summary><div class="ownerSectionBody"><div class="two"><div><label data-ui-key="Customer fee">Customer fee</label><input id="customerFeeUSD" type="number" min="0" max="10000" step="0.01"><label data-ui-key="Provider fee">Provider fee</label><input id="providerFeeUSD" type="number" min="0" max="10000" step="0.01"></div><div><label data-ui-key="Commission currency">Commission currency</label><select id="defaultCurrency"><option value="USD">USD — US dollar</option><option value="EUR">EUR — Euro</option></select></div></div><button class="goldBtn" onclick="saveSettings()">Save fee settings</button></div></details>
       <details class="panel ownerSection"><summary>Owner security</summary><div class="ownerSectionBody"><div class="two"><div><label>Current password</label><input id="ownerCurrentPassword" type="password" autocomplete="current-password"></div><div><label>New password</label><input id="ownerNewPassword" type="password" minlength="10" autocomplete="new-password"></div></div><button class="outlineBtn" onclick="changeOwnerPassword()">Change password</button></div></details>
      </div>
      <div id="adminArea"></div>
